input {
  kafka {
    bootstrap_servers => "${KAFKA_BOOTSTRAP_SERVERS}"
    topics => ["${AI_GATEWAY_LOGGING_TOPIC:ai-gateway.logs}"]
    group_id => "${LOGSTASH_GROUP_ID:ai-gateway-logstash}"
    codec => json
    consumer_threads => 2
  }
}

filter {
  date {
    match => ["requestTimestamp", "ISO8601"]
    target => "@timestamp"
  }
  mutate {
    add_field => {
      "[@metadata][index_name]" => "ai-gateway-logs-%{+YYYY.MM.dd}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index => "%{[@metadata][index_name]}"
    user => "${ELASTICSEARCH_USER:}"
    password => "${ELASTICSEARCH_PASSWORD:}"
  }
}
